  --status-pending-row: #fcf8ed;

  --status-dc-row: #fff7ed;

function persistMammo(sign,confirmed=false){const r=current;if(!r||r.type!==1)return;const m=r.mammo,index=mammoAction(r,identity),value=mammoFormData();if(index===null||!value)return;

const batchTemplate=Object.freeze(Object.fromEntries(templates[0].map(field=>[field,phrases[field][0]])));
const batchReviewed=new Map(),batchSelected=new Set();
function batchScope(r){return role==='doctor'&&r.type===0&&r.formatIndex===0&&r.image&&!r.dc&&r.doctor===identity&&['未完成','已完成'].includes(r.status)}
function batchCanDraft(r){return batchScope(r)&&r.status==='未完成'&&!Object.values(saved[r.id]||{}).some(v=>String(v).trim())}
function batchHasReport(r){return batchScope(r)&&templates[0].every(f=>String(saved[r.id]?.[f]||'').trim())}
function batchCanCertify(r){const v=batchReviewed.get(r.id);return batchHasReport(r)&&!!v&&v.report===saved[r.id]&&v.status===r.status&&v.doctor===identity}
function batchApply(ids,mode){const changed=[],skipped=[];for(const id of new Set(ids)){
 const r=rows.find(x=>x.id===id);
 if(!r||!(mode==='draft'?batchCanDraft(r):batchCanCertify(r))){skipped.push(id);continue}
 if(mode==='draft')saved[id]={...batchTemplate};else{r.status='已認證';r.revoked=false}

function batchDialog(title,body,label,apply){
 const d=$('rad-dialog');d.innerHTML=`<h2>${title}</h2>${body}<div class="list-tools"><button id="batch-cancel">取消</button><button class="primary" id="batch-apply">${label}</button></div>`;

function batchPreview(r){

 batchDialog('逐筆確認報告',`<p><strong>${esc(r.id)} · ${esc(r.name)}</strong> · ${esc(r.exam)}</p><p>此頁未連接影像系統。請參照實際影像核對本筆報告內容。</p>${templates[0].map(f=>`<h3>${f}</h3><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(version[f])}</p>`).join('')}`,'確認本筆可認證',()=>{
  if(batchHasReport(r)&&saved[r.id]===version&&r.status===status&&identity===doctor){batchReviewed.set(r.id,{report:version,status,doctor});renderList();announce(r.id+' 已確認，尚未認證。')}

function batchStart(mode){

 if(!valid.length){announce(mode==='draft'?'選取案件沒有可帶入的空白報告。':'請先逐筆確認已選案件的報告內容。');return}
 batchDialog(mode==='draft'?'批次帶入草稿':'批次認證',`<p>本次處理：${valid.map(esc).join('、')}（${valid.length} 筆）</p>${skipped.length?`<p>略過不符合條件：${skipped.map(esc).join('、')}</p>`:''}${mode==='draft'?`<p>以下為待核對的草稿範本。帶入草稿不代表完成判讀，也不會覆寫既有內容或認證。</p>${templates[0].map(f=>`<p><strong>${f}：</strong>${esc(batchTemplate[f])}</p>`).join('')}`:'<p>只認證已逐筆確認且內容未變更的報告。</p>'}`,mode==='draft'?'確認帶入草稿':'確認批次認證',()=>{
  const result=batchApply(valid,mode);result.changed.forEach(id=>{if(mode==='certify')batchSelected.delete(id)});renderList();

 });

function renderDoctorBatch(){
 const candidates=rows.filter(batchScope);
 $('list').insertAdjacentHTML('afterbegin',`<details class="panel mammo-panel" id="doctor-batch"><summary><strong>健檢胸部 X 光 · 批次處理</strong>（${candidates.length} 筆可處理）</summary><p class="muted">本區依目前目前醫師列出可用影像、未取消且未認證的健檢胸部 X 光，不受下方清單篩選影響。兩項操作分開執行。本區勾選僅用於報告草稿／認證，不影響下方的指派選取。</p><div class="tablewrap"><table><thead><tr><th>選取</th><th>單號／姓名</th><th>報告進度</th><th>確認內容</th></tr></thead><tbody>${candidates.map(r=>`<tr><td><input type="checkbox" data-doctor-batch="${r.id}" aria-label="選取 ${r.id}" ${batchSelected.has(r.id)?'checked':''}></td><td>${esc(r.id)} · ${esc(r.name)}</td><td>${batchCanCertify(r)?'已逐筆確認・待認證':batchHasReport(r)?'有內容・待確認':Object.values(saved[r.id]||{}).some(Boolean)?'內容未齊':'空白・可帶入草稿'}</td><td><button data-doctor-review="${r.id}" ${batchHasReport(r)?'':'disabled'}>核對 ${r.id}</button></td></tr>`).join('')||'<tr><td colspan="4">目前沒有符合條件的案件。</td></tr>'}</tbody></table></div><div class="actions"><button id="doctor-batch-draft">批次帶入草稿</button><button class="primary" id="doctor-batch-certify">批次認證</button></div></details>`);
 const panel=$('doctor-batch');panel.open=batchPanelOpen;panel.ontoggle=()=>{batchPanelOpen=panel.open};
 panel.querySelectorAll('[data-doctor-batch]').forEach(x=>x.onchange=()=>x.checked?batchSelected.add(x.dataset.doctorBatch):batchSelected.delete(x.dataset.doctorBatch));
 panel.querySelectorAll('[data-doctor-review]').forEach(x=>x.onclick=()=>batchPreview(rows.find(r=>r.id===x.dataset.doctorReview)));
 $('doctor-batch-draft').onclick=()=>batchStart('draft');$('doctor-batch-certify').onclick=()=>batchStart('certify');
}
let batchPanelOpen=false;
const originalDoctorList=renderList;
renderList=function(){originalDoctorList();if(role==='doctor')renderDoctorBatch()};

window.addEventListener('beforeunload',e=>{if(current?.type===1){if(mammoHasChanges()){e.preventDefault();e.returnValue=''}return}if(current&&current.type!==1&&eligible(current)){readDraft();if(Object.values(draft).some(Boolean)){e.preventDefault();e.returnValue=''}}});renderList();
</script></html>
