<div class="rad-tools"><span id="selected-count">已選 ${selected.size} 筆</span><button id="batch-assign" ${selected.size?'':'disabled'}>批次指派醫師</button><button id="batch-format" ${selected.size?'':'disabled'}>確認選取案件的建議格式</button><button id="auto-retrieve">模擬自動取回已照影像</button></div>
<div class="tablewrap"><table><thead><tr><th><input id="select-all" type="checkbox" aria-label="選取本頁可指派案件"></th>${[['id','單號'],['exam','檢查'],['date','檢查時間'],['doctor','報告醫師'],['status','報告狀態']].map(([k,t])=>`<th><button data-rad-sort="${k}">${t} ${radState.sort===k?(radState.asc?'↑':'↓'):'↕'}</button></th>`).join('')}<th>影像／醫令</th><th>報告格式</th><th>操作</th></tr></thead><tbody>${items.map(r=>`<tr><td><input type="checkbox" data-select="${r.id}" aria-label="選取 ${r.id}" ${selected.has(r.id)?'checked':''} ${canAssign(r)?'':'disabled'}></td><td><strong>${r.id}</strong><small class="rad-status">${r.name}</small></td><td>${r.exam}</td><td>${r.date}<br>${r.time}</td><td>${r.doctor}<small class="rad-status">${!r.image&&!r.dc?'待影像，不進入可撰寫佇列':''}</small></td><td>${badge(r)}</td><td>${r.performed?'已照':'未照'} · ${r.image?'影像可用':'尚無可用影像'} ${r.dc?'<span class="badge dc">醫令已 DC</span>':''}</td><td>${types[r.formatIndex]}<small class="rad-status">${r.formatConfirmed?'✓ 已確認':'自動帶入建議，尚未確認'}</small></td><td><div class="list-tools"><button data-assign="${r.id}" ${canAssign(r)?'':'disabled'}>指派 ${r.id}</button><button data-format="${r.id}" ${canAssign(r)?'':'disabled'}>確認格式 ${r.id}</button>${!r.image&&!r.dc?`<button data-image="${r.id}">${r.performed?'模擬取回影像':'模擬完成檢查'} ${r.id}</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="9" class="empty">沒有符合條件的檢查</td></tr>'}</tbody></table></div></div>
<p class="footnote">雛型假設：未照也能先指派；已完成／已認證或已DC的案件不開放重新指派。已DC且未照的 R0008 不顯示，已DC且已照的 R0004 保留。角色切換僅供課程模擬，不代表真實權限。<br>影像取回、完成檢查及格式確認皆為本頁模擬，未串接 PACS 或儀器；沒有實作依班表自動分派。重新整理會重設資料。</p>`;
$('show-unassigned').onclick=()=>{radState.assignment='unassigned';renderRad()};
for(const [id,key] of [['rad-assignment','assignment'],['rad-image','image'],['rad-type','type'],['rad-date','date']])$(id).onchange=e=>{radState[key]=e.target.value;selected.clear();renderRad()};
$('rad-search').oninput=e=>{radState.q=e.target.value;selected.clear();const pos=e.target.selectionStart;renderRad();$('rad-search').focus();$('rad-search').setSelectionRange(pos,pos)};
$('rad-clear').onclick=()=>{radState={assignment:'',image:'',type:'',q:'',date:'',sort:'date',asc:true};selected.clear();renderRad()};$('rad-reset').onclick=()=>location.reload();
document.querySelectorAll('[data-rad-sort]').forEach(b=>b.onclick=()=>{radState.asc=radState.sort===b.dataset.radSort?!radState.asc:true;radState.sort=b.dataset.radSort;renderRad()});
document.querySelectorAll('[data-select]').forEach(c=>c.onchange=()=>{c.checked?selected.add(c.dataset.select):selected.delete(c.dataset.select);renderRad()});
const selectable=items.filter(canAssign);$('select-all').checked=selectable.length>0&&selectable.every(r=>selected.has(r.id));$('select-all').indeterminate=selected.size>0&&!$('select-all').checked;$('select-all').onchange=e=>{selectable.forEach(r=>e.target.checked?selected.add(r.id):selected.delete(r.id));renderRad()};
document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>openAssignment([b.dataset.assign]));$('batch-assign').onclick=()=>openAssignment([...selected]);
document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>openFormat(b.dataset.format));$('batch-format').onclick=()=>{selected.forEach(id=>rows.find(r=>r.id===id).formatConfirmed=true);renderRad();announce('已確認選取案件目前顯示的報告格式。')};
document.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>{const r=rows.find(r=>r.id===b.dataset.image);if(!r.performed){r.performed=true;renderRad();announce(r.id+' 已模擬完成檢查，仍待取回影像。');return}r.image=true;renderRad();announce(r.id+' 已模擬取回影像；指派醫師的可撰寫數量已同步更新。')});
$('auto-retrieve').onclick=()=>{const pending=rows.filter(r=>r.performed&&!r.image&&!r.dc);pending.forEach(r=>r.image=true);renderRad();announce(pending.length?'已模擬取回 '+pending.length+' 筆已照影像。':'目前沒有已照但待取回的影像；未照案件不會被自動改成已照。')};
}
function openAssignment(ids){
assignmentIds=ids.filter(id=>rows.some(r=>r.id===id&&canAssign(r)));chosenDoctor='';if(!assignmentIds.length)return;
const waiting=assignmentIds.filter(id=>!rows.find(r=>r.id===id).image);
$('rad-dialog').innerHTML=`<h2>指派報告醫師</h2><p>案件：${assignmentIds.join('、')}</p>${waiting.length?`<p class="notice">${waiting.join('、')} 尚無影像。可先指派，但維持待影像，不能撰寫或認證。</p>`:''}<label for="doctor-query">搜尋報告醫師</label><input id="doctor-query" placeholder="輸入甲或丙搜尋"><div class="results" id="doctor-results"></div><p id="doctor-picked" role="status">尚未選擇醫師</p><div class="list-tools"><button id="cancel-assignment">取消</button><button class="primary" id="apply-assignment" disabled>確認指派</button></div>`;
const refresh=()=>{const q=$('doctor-query').value;$('doctor-results').innerHTML=['醫師甲','醫師丙'].filter(d=>d.includes(q)).map(d=>`<button data-pick-doctor="${d}" aria-pressed="${chosenDoctor===d}">${d}</button>`).join('')||'<p>沒有符合的醫師</p>';document.querySelectorAll('[data-pick-doctor]').forEach(b=>b.onclick=()=>{chosenDoctor=b.dataset.pickDoctor;$('doctor-picked').textContent='已選擇：'+chosenDoctor;$('apply-assignment').disabled=false;refresh()})};
$('doctor-query').oninput=refresh;refresh();$('cancel-assignment').onclick=()=>$('rad-dialog').close();$('apply-assignment').onclick=()=>applyAssignment();$('rad-dialog').showModal();$('doctor-query').focus();
}
function applyAssignment(){
if(!['醫師甲','醫師丙'].includes(chosenDoctor))return;
const assigned=assignmentIds.filter(id=>rows.some(r=>r.id===id&&canAssign(r)));assigned.forEach(id=>rows.find(r=>r.id===id).doctor=chosenDoctor);
const wait=assigned.filter(id=>!rows.find(r=>r.id===id).image);$('rad-dialog').close();selected.clear();renderRad();announce(assigned.join('、')+' 已指派給 '+chosenDoctor+'。'+(wait.length?'其中 '+wait.join('、')+' 仍待影像，不計入可撰寫數量。':'可切換該醫師身分確認可撰寫數量。'));
}
function openFormat(id){const r=rows.find(r=>r.id===id);$('rad-dialog').innerHTML=`<h2>確認報告格式 · ${id}</h2><p>系統依「${types[r.type]}」帶入建議格式，可在此確認或更換。</p><label for="format-choice">報告格式</label><select id="format-choice">${types.map((t,i)=>`<option value="${i}" ${r.formatIndex===i?'selected':''}>${t}</option>`).join('')}</select><p id="format-fields">欄位：${templates[r.formatIndex].join('、')}</p><div class="list-tools"><button id="cancel-format">取消</button><button class="primary" id="apply-format">確認格式</button></div>`;$('format-choice').onchange=e=>$('format-fields').textContent='欄位：'+templates[Number(e.target.value)].join('、');$('cancel-format').onclick=()=>$('rad-dialog').close();$('apply-format').onclick=()=>{r.formatIndex=Number($('format-choice').value);r.formatConfirmed=true;$('rad-dialog').close();renderRad();announce(id+' 報告格式已確認為 '+types[r.formatIndex]+'。')};$('rad-dialog').showModal()}
function switchRole(nextRole,nextIdentity=identity){
if(current&&eligible(current)){readDraft();if(JSON.stringify(draft)!==JSON.stringify(saved[current.id]||{})&&Object.values(draft).some(Boolean)&&!confirm('尚有未儲存內容，確定切換角色？')){$('identity').value=identity;return}}
role=nextRole;identity=nextIdentity;current=null;queue=[];selected.clear();$('notice').classList.add('hidden');
$('role-caption').textContent=role==='rad'?'／放射師介面':'／醫師介面';$('role-doctor').setAttribute('aria-pressed',String(role==='doctor'));$('role-rad').setAttribute('aria-pressed',String(role==='rad'));$('identity').disabled=role==='rad';$('identity-label').classList.toggle('hidden',role==='rad');$('identity').classList.toggle('hidden',role==='rad');
if(role==='doctor'){state={type:'',doctor:identity,status:'',q:'',date:'',sort:'date',asc:true};$('identity').value=identity}renderList();
}
$('role-doctor').onclick=()=>switchRole('doctor');$('role-rad').onclick=()=>switchRole('rad');$('identity').onchange=e=>switchRole('doctor',e.target.value);

window.addEventListener('beforeunload',e=>{if(current&&eligible(current)){readDraft();if(Object.values(draft).some(Boolean)){e.preventDefault();e.returnValue=''}}});renderList();
</script></html>
