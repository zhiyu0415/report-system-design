:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#243443;background:#f3f6f8;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #c7d3dc;background:white;border-radius:7px;padding:9px 15px;color:#243443}button:hover{background:#e8f3f4}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #25a8a0;outline-offset:2px}button:disabled{opacity:.45;cursor:default}.primary{background:#087f80;color:white;border-color:#087f80}.primary:hover{background:#066c6d}header{background:#123941;color:white;padding:18px 30px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:20px}header small{color:#c3dddd}main{max-width:1500px;margin:auto;padding:26px}h1{font-size:25px;margin:0 0 5px}h2{font-size:19px;margin:0}p{line-height:1.6}.muted{color:#647586}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:20px 0}.card{background:white;text-align:left;padding:16px;border:1px solid #dbe3e9;border-radius:10px}.card.active{border:2px solid #087f80;background:#eaf6f5}.card b{display:block;font-size:30px;margin-top:7px}.card:first-child{background:#123941;color:white}.panel{background:white;border:1px solid #dbe3e9;border-radius:12px;overflow:hidden}.filters{display:flex;gap:14px;flex-wrap:wrap;padding:20px;border-bottom:1px solid #e0e7ec;align-items:end}label{display:block;font-size:13px;font-weight:600}input,select{display:block;padding:9px;border:1px solid #c7d3dc;border-radius:6px;background:white;margin-top:6px;color:#243443}input[type=checkbox]{display:inline;margin:0 6px 0 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}th,td{padding:14px 13px;text-align:left;border-bottom:1px solid #e3e9ed}th{background:#f7f9fb;font-weight:600}th button{border:0;padding:0;background:transparent}tr.pending{background:#fffdf3}tr.certified{background:#edf7f2}.badge{padding:4px 8px;border-radius:5px;background:#fff0bc;color:#77570c;font-size:12px;display:inline-block}.done{background:#e6eef6;color:#355b80}.signed{background:#d5eee0;color:#246446}.dc{background:#fbe4e4;color:#993b3b}.footnote{font-size:12px;color:#647586;margin-top:14px;line-height:1.8}.patient{padding:18px 22px;margin-bottom:18px;display:flex;gap:28px;flex-wrap:wrap;align-items:center}.patient strong{font-size:21px}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:20px}.image{background:#25313d;min-height:520px;border-radius:12px;color:#b9c7d3;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border:1px solid #364553}.image span{font-size:23px;letter-spacing:3px}.image small{margin-top:10px}.image:before{content:'';width:65%;height:62%;position:absolute;border:1px dashed #647483;border-radius:7px}.editor{padding:22px}.editor-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8ed;padding-bottom:18px;margin-bottom:20px}.field{margin:18px 0}.field label{font-size:15px}.field textarea{display:block;width:100%;min-height:105px;resize:vertical;margin:8px 0;border:1px solid #c7d3dc;border-radius:7px;padding:12px;line-height:1.6}.phrase{font-size:12px;padding:5px 9px;margin:3px 4px 0 0;text-align:left}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:22px;align-items:center}.notice{background:#e8f5f3;color:#195e59;border:1px solid #b5ded7;padding:12px 18px;border-radius:8px;margin-bottom:18px}.empty{text-align:center;padding:45px}.hidden{display:none!important}@media(max-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}.workspace{grid-template-columns:1fr}.image{min-height:280px}}@media(max-width:600px){main{padding:14px}header{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}.intro{align-items:start;gap:10px}.actions{flex-wrap:wrap}.patient{gap:14px}}
tr[data-case]{cursor:pointer}tr[data-case]:hover{box-shadow:inset 4px 0 #087f80} .list-tools{display:flex;gap:10px;flex-wrap:wrap}.report-entry{position:sticky;right:0;background:#ffffff;box-shadow:-3px 0 8px #24344310} .entry-help{font-size:13px;color:#647586;margin:0 0 14px} @media(max-width:600px){.intro{flex-wrap:wrap}.list-tools{width:100%}}
.report-order{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding-bottom:18px}.report-order label{font-size:15px}.report-order input{margin:0;width:140px;font-weight:700;background:#f3f6f8}.report-order small{font-size:12px}
.image-controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px}.image-controls .muted{font-size:13px}.image-controls [role="status"]{font-size:13px;color:#195e59}.workspace.image-collapsed{grid-template-columns:1fr}.image[hidden]{display:none!important}

<header><strong>▦ 影像報告工作站 <small>／醫師介面</small></strong><small>課程互動雛型 · 醫師甲</small></header>
<main><div id="notice" class="notice hidden" role="status" aria-live="polite"></div><section id="list"></section><section id="report" class="hidden"></section></main>
<script>
const types=['健檢胸部X光','健檢乳攝','門診放射','心臟超音波','頸動脈超音波'];
const rows=[
['R0001','2026-11-02','08:40',0,'胸部X光數位攝影','健檢中心','醫師丁','測試一號','男',45,'TEST000001',false,true,'未完成','醫師甲'],
['R0002','2026-11-02','09:05',1,'2D+3D乳房攝影','健檢中心','醫師丁','測試二號','女',52,'TEST000002',false,true,'未完成','醫師甲'],
['R0003','2026-11-02','09:30',2,'胸部X光（正面）','肝膽腸胃科','醫師戊','測試三號','男',63,'TEST000003',false,true,'已完成','醫師甲'],
['R0004','2026-11-02','10:10',2,'腹部X光','肝膽腸胃科','醫師戊','測試四號','女',58,'TEST000004',true,true,'未完成','醫師甲'],
['R0005','2026-11-02','10:45',0,'胸部X光數位攝影','健檢中心','醫師丁','測試五號','女',38,'TEST000005',false,true,'已認證','醫師丙'],
['R0006','2026-11-02','11:20',3,'心臟超音波','心臟內科','醫師己','測試六號','男',71,'TEST000006',false,true,'未完成','未指派'],
['R0007','2026-11-03','08:50',4,'頸動脈超音波','神經內科','醫師庚','測試七號','女',66,'TEST000007',false,true,'未完成','醫師丙'],
['R0008','2026-11-03','09:15',1,'2D+3D乳房攝影','健檢中心','醫師丁','測試八號','女',47,'TEST000008',true,false,'未完成','未指派'],
['R0009','2026-11-03','09:40',0,'胸部X光數位攝影','健檢中心','醫師丁','測試九號','男',55,'TEST000009',false,false,'未完成','未指派'],
['R0010','2026-11-03','10:20',2,'胸部X光（正面）','家醫科','醫師辛','測試十號','男',49,'TEST000010',false,true,'未完成','醫師甲']
].map(r=>Object.fromEntries(['id','date','time','type','exam','unit','orderDoctor','name','sex','age','identity','dc','image','status','doctor'].map((k,i)=>[k,r[i]])));
const templates=[['Lung','Others','Suggestion'],['Findings','Diagnosis'],['Finding','Impression'],['Findings','Impression'],['Findings','Impression']];
const phrases={Lung:['No active lung lesion.','Increased lung markings in both lungs.'],Others:['Normal heart size.','Mild scoliosis of thoracic spine.'],Suggestion:['Follow-up as clinically indicated.','Suggest further evaluation with chest CT.'],Findings:['Scattered areas of fibroglandular density.'],Diagnosis:['BI-RADS 1: Negative.','BI-RADS 2: Benign finding.'],Finding:['No active lung lesion.','No obvious bony abnormality.'],Impression:['No significant abnormality.']};
let imageVisible=true;
let state={type:'',doctor:'醫師甲',status:'',q:'',date:'',sort:'date',asc:true},current=null,queue=[],draft={},saved={};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base=()=>rows.filter(r=>!(r.dc&&!r.image)&&(!state.doctor||r.doctor===state.doctor)&&(!state.date||r.date===state.date)&&(!state.q||[r.id,r.name,r.identity,r.exam].some(x=>x.includes(state.q))));
const sorted=a=>a.sort((a,b)=>String(state.sort==='date'?a.date+a.time:a[state.sort]).localeCompare(String(state.sort==='date'?b.date+b.time:b[state.sort]),'zh-Hant')*(state.asc?1:-1));
const visible=()=>sorted(base().filter(r=>(state.type===''||r.type===Number(state.type))&&(!state.status||r.status===state.status)));
const eligible=r=>r.status==='未完成'&&r.image&&!r.dc;
function badge(r){return `<span class="badge ${r.status==='已完成'?'done':r.status==='已認證'?'signed':''}">${r.status}</span>`}
function announce(s){$('notice').textContent=s;$('notice').classList.remove('hidden')}
function renderList(){current=null;$('report').classList.add('hidden');$('list').classList.remove('hidden');const pending=base().filter(r=>r.status==='未完成');$('list').innerHTML=`<div class="intro"><div><h1>醫師工作清單</h1><span class="muted">選擇檢查，開始撰寫報告</span></div><div class="list-tools"><button class="primary" id="start">開始第一筆未完成報告 →</button><button id="reset">重設模擬資料</button></div></div><p class="entry-help">點選檢查列或右側「撰寫報告」進入填寫；上方數量卡用來篩選。已取消醫令／未照案件僅供檢視。</p><div class="cards">${['全部未完成',...types].map((t,i)=>`<button class="card ${state.type===(i===0?'':String(i-1))?'active':''}" data-type="${i===0?'':i-1}">${t}<b>${pending.filter(r=>i===0||r.type===i-1).length}</b></button>`).join('')}</div><div class="muted" style="font-size:12px;margin-bottom:14px">數量依醫師、檢查日期與搜尋條件計算；包含已 DC／已照的未完成報告。</div><div class="panel"><div class="filters"><label>報告醫師<select id="doctor">${['','醫師甲','醫師丙','未指派'].map(x=>`<option value="${x}" ${state.doctor===x?'selected':''}>${x||'全部醫師'}</option>`).join('')}</select></label><label>檢查日期<input type="date" id="date" value="${state.date}"></label><label>報告狀態<select id="status">${['','未完成','已完成','已認證'].map(x=>`<option ${state.status===x?'selected':''} value="${x}">${x||'全部狀態'}</option>`).join('')}</select></label><label>搜尋<input id="search" placeholder="姓名、單號、身分證號、檢查" value="${esc(state.q)}"></label><button id="clear">清除篩選</button></div><div class="tablewrap"><table><thead><tr>${[['id','單號'],['name','病人'],['date','檢查日期／時間'],['exam','檢查名稱'],['orderDoctor','開單醫師'],['doctor','報告醫師'],['status','報告狀態']].map(([k,t])=>`<th><button data-sort="${k}">${t} ${state.sort===k?(state.asc?'↑':'↓'):'↕'}</button></th>`).join('')}<th>影像／醫令</th><th>操作</th></tr></thead><tbody>${visible().map(r=>`<tr data-case="${r.id}" class="${r.status==='未完成'?'pending':r.status==='已認證'?'certified':''}"><td>${r.id}</td><td><strong>${r.name}</strong><br><small class="muted">${r.sex}／${r.age}歲</small></td><td>${r.date}<br><small>${r.time}</small></td><td>${r.exam}</td><td>${r.orderDoctor}</td><td>${r.doctor}</td><td>${badge(r)}</td><td>${r.image?'已照':'未照'} ${r.dc?'<span class="badge dc">醫令已 DC</span>':''}</td><td class="report-entry"><button data-open="${r.id}">${eligible(r)?'撰寫報告':'檢視'}</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">沒有符合條件的檢查</td></tr>'}</tbody></table></div></div><p class="footnote">雛型假設：已 DC 且未照的 R0008 不顯示；已 DC 且已照者保留供檢視。未照、已 DC、已完成與已認證案件均不進入自動撰寫佇列。<br>資料只存在本頁變數中，重新整理後恢復原狀。所有病人資料皆為案例提供的虛構測試值。</p>`;
$('doctor').onchange=e=>{state.doctor=e.target.value;renderList()};$('date').onchange=e=>{state.date=e.target.value;renderList()};$('status').onchange=e=>{state.status=e.target.value;renderList()};$('search').oninput=e=>{const pos=e.target.selectionStart;state.q=e.target.value;renderList();$('search').focus();$('search').setSelectionRange(pos,pos)};$('clear').onclick=()=>{state={...state,type:'',doctor:'',status:'',q:'',date:''};renderList()};$('reset').onclick=()=>location.reload();document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;renderList()});document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{state.asc=state.sort===b.dataset.sort?!state.asc:true;state.sort=b.dataset.sort;renderList()});const enter=id=>{queue=visible().filter(eligible).map(r=>r.id);openReport(id)};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();enter(b.dataset.open)});document.querySelectorAll('[data-case]').forEach(r=>r.onclick=()=>enter(r.dataset.case));const first=visible().find(eligible);$('start').disabled=!first;$('start').textContent=first?'開始第一筆未完成報告 →':'目前篩選下沒有可填寫的報告';$('start').onclick=()=>{if(first)enter(first.id)};}
function readDraft(){if(current)templates[current.type].forEach((f,i)=>draft[f]=$('field'+i)?.value||'')}
function leave(){readDraft();if(eligible(current)&&Object.values(draft).some(Boolean)&&JSON.stringify(draft)!==JSON.stringify(saved[current.id]||{})&&!confirm('尚有未儲存內容，確定返回清單？'))return;renderList()}
function openReport(id){current=rows.find(r=>r.id===id);draft={...(saved[id]||{})};const r=current,editable=eligible(r);$('list').classList.add('hidden');$('report').classList.remove('hidden');$('report').innerHTML=`<div class="intro"><div><button id="back">← 工作清單</button> <span class="muted">${id} ／ ${types[r.type]}</span></div><div class="list-tools">${badge(r)}${r.status==='已認證'?'<button id="revoke">取消認證並修改</button>':''}${r.status==='已完成'&&saved[id]?'<button class="primary" id="certify">認證報告</button>':''}</div></div><div class="panel patient"><div><strong>${r.name}</strong>　${r.sex}／${r.age}歲<br><small class="muted">${r.identity}</small></div><div>${r.exam}<br><small class="muted">檢查：${r.date} ${r.time}</small></div><div>開單醫師：${r.orderDoctor}<br><small class="muted">${r.unit} · 報告醫師：${r.doctor}</small></div>${r.dc?'<span class="badge dc">醫令已 DC · 僅供檢視</span>':''}</div>${r.revoked?'<p class="notice">此報告已取消認證，可修改後在本畫面儲存與重新認證。</p>':''}<div class="image-controls"><button id="toggle-image" aria-controls="report-image" aria-expanded="true" aria-keyshortcuts="F9">關閉影像（F9）</button><span class="muted" id="image-shortcut-help">快捷鍵：按 F9 開啟／關閉影像區；部分鍵盤需按 Fn＋F9。切換不影響報告內容。</span><span id="image-visibility-status" role="status" aria-live="polite">影像區已開啟</span></div><div class="workspace" id="report-workspace"><div class="image" id="report-image"><span>${r.image?'影像顯示區':'尚無影像'}</span><small>${r.id} · ${r.exam}</small><small>課程示意，未連接 PACS</small></div><div class="panel editor"><div class="report-order"><label for="report-order-id">單號</label><input id="report-order-id" value="${esc(r.id)}" readonly aria-describedby="order-help"><small id="order-help" class="muted">依目前檢查自動帶入</small></div><div class="editor-top"><h2>${types[r.type]}報告</h2><small class="muted">${editable?(r.revoked?'取消認證後修改中':'編輯中'):'唯讀檢視'}</small></div>${!editable?'<p class="muted">'+(saved[id]?'以下為本次已儲存的報告內容。':(r.dc?'此醫令已取消，目前僅供檢視。':!r.image?'尚無影像，目前僅供檢視。':'此報告已完成或已認證，目前僅供檢視。')+'案例未提供既有報告內文。')+'</p>':''}${templates[r.type].map((f,i)=>`<div class="field"><label for="field${i}">${f}</label><textarea id="field${i}" ${editable?'':'readonly'} placeholder="${editable?'請輸入 '+f:'未提供報告內容'}">${esc(draft[f]||'')}</textarea>${editable?(r.type<3?(phrases[f]||[]):[]).map((p,n)=>`<button class="phrase" data-field="${i}" data-phrase="${n}">＋ ${p}</button>`).join(''):''}</div>`).join('')}<div class="actions"><span class="muted" style="font-size:12px">${editable?'可先儲存留在本筆確認，或直接儲存並認證。':r.status==='已認證'?'已認證，若需修改請先取消認證。':''}</span><div class="list-tools">${editable?'<button id="save-stay">儲存</button><button id="save">儲存並跳下一筆 →</button><button class="primary" id="save-certify">儲存並認證</button>':r.status==='已認證'?'<button id="revoke-inline">取消認證並修改</button>':r.status==='已完成'&&saved[id]?'<button class="primary" id="certify-inline">認證報告</button>':''}</div></div></div></div><p class="footnote">跳轉範圍：開啟報告當下清單中可撰寫的案件，依當時排序向後尋找；末筆後接續佇列前方仍未完成的案件。<br>開單日期及既有報告內文未包含於案例模擬資料，因此不另行編造。片語僅供課程雛型使用。取消認證與認證為流程示範，尚未定義角色權限。</p>`;$('back').onclick=leave;$('toggle-image').onclick=toggleImage;applyImageVisibility();
if($('revoke'))$('revoke').onclick=()=>{
if(!confirm('取消認證後，這份報告會回到未完成狀態，修改並儲存後需要重新認證。確定繼續？'))return;
r.status='未完成';r.revoked=true;queue=visible().filter(eligible).map(x=>x.id);if(!queue.includes(id))queue.unshift(id);openReport(id);announce(id+' 已取消認證，可修改報告。'+(saved[id]?'已保留原填寫內容。':'案例未提供原認證內文，請以測試內容填寫。'));
};
if($('certify'))$('certify').onclick=()=>{if(!confirm('確認 '+id+' 的報告內容無誤，並認證？'))return;r.status='已認證';r.revoked=false;openReport(id);announce(id+' 已認證，報告已鎖定為唯讀。')};
document.querySelectorAll('[data-phrase]').forEach(b=>b.onclick=()=>{const f=templates[r.type][Number(b.dataset.field)],t=$('field'+b.dataset.field),p=phrases[f][Number(b.dataset.phrase)];t.value+=(t.value?'\n':'')+p;t.focus()});if($('save'))$('save').onclick=()=>save('next');
if($('save-stay'))$('save-stay').onclick=()=>save('stay');
if($('save-certify'))$('save-certify').onclick=()=>save('certify');
if($('certify-inline'))$('certify-inline').onclick=$('certify').onclick;
if($('revoke-inline'))$('revoke-inline').onclick=$('revoke').onclick;
window.scrollTo(0,0)}
function applyImageVisibility(){
const image=$('report-image'),workspace=$('report-workspace'),button=$('toggle-image');
if(!image||!workspace||!button)return;
image.hidden=!imageVisible;workspace.classList.toggle('image-collapsed',!imageVisible);
button.setAttribute('aria-expanded',String(imageVisible));
button.textContent=imageVisible?'關閉影像（F9）':'開啟影像（F9）';
$('image-visibility-status').textContent=imageVisible?'影像區已開啟':'影像區已關閉';
}
function toggleImage(){if(!current)return;imageVisible=!imageVisible;applyImageVisibility()}
window.addEventListener('keydown',event=>{
if(event.key!=='F9'||!current||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
event.preventDefault();if(event.repeat)return;toggleImage();
});
function save(mode='next'){
readDraft();const missing=templates[current.type].find(f=>!draft[f]?.trim());
if(missing){announce('請填寫 '+missing+' 後再儲存。');$('field'+templates[current.type].indexOf(missing)).focus();return}
const id=current.id;
if(mode==='certify'&&!confirm('確認 '+id+' 的內容無誤，儲存並正式認證？'))return;
saved[id]={...draft};current.status=mode==='certify'?'已認證':'已完成';
if(mode==='certify'){current.revoked=false;openReport(id);announce(id+' 已儲存並認證，內容已鎖定；若需修正可取消認證並修改。');return}
if(mode==='stay'){openReport(id);announce(id+' 已儲存為已完成，請確認內容後按「認證報告」。');return}
const index=queue.indexOf(id),ordered=[...queue.slice(index+1),...queue.slice(0,index)];
const next=ordered.find(id=>eligible(rows.find(r=>r.id===id)));
if(next){openReport(next);announce(id+' 已儲存為已完成，已開啟下一筆 '+next+'。')}
else{renderList();announce(id+' 已儲存。本次佇列已全部完成，已返回工作清單。')}
}
window.addEventListener('beforeunload',e=>{if(current&&eligible(current)){readDraft();if(Object.values(draft).some(Boolean)){e.preventDefault();e.returnValue=''}}});renderList();
